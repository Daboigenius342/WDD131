<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card | Gritspire</title>
  <meta name="description" content="An interactive character card for Gritspire. Attack him or level him up.">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Character Card | Gritspire">
  <meta property="og:description" content="An interactive character card for Gritspire. Attack him or level him up.">
  <meta property="og:url" content="https://daboigenius342.github.io/wdd131/charactercard/">
  <meta property="og:image" content="https://daboigenius342.github.io/wdd131/charactercard/images/social-preview.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Character Card | Gritspire">
  <meta name="twitter:description" content="An interactive character card for Gritspire. Attack him or level him up.">
  <meta name="twitter:image" content="https://daboigenius342.github.io/wdd131/charactercard/images/social-preview.jpg">

  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Exo+2:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <div class="card">
      <img class="image" id="charImage" src="images/gritspire.jpg" alt="" width="400" height="400">
      <h1 class="name" id="charName"></h1>
      <div class="stats">
        <p><strong>Class:</strong> <span id="charClass"></span></p>
        <p><strong>Level:</strong> <span id="charLevel"></span></p>
        <p><strong>Health:</strong> <span id="charHealth"></span></p>
      </div>
      <div class="buttons">
        <button type="button" id="attackBtn">Attacked</button>
        <button type="button" id="levelBtn">Level Up</button>
      </div>
      <p class="message" id="message" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
